<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Workout Session - FitCoach</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                "fit-cream": "#FFF8F0",
                "fit-card": "#FFFFFF",
                "fit-primary": "#FF8577", // Peachy Coral
                "fit-primary-dark": "#E66A5C",
                "fit-secondary": "#6EE7B7", // Mint
                "fit-secondary-dark": "#5BC79C",
                "fit-accent": "#FCD34D", // Sunny Yellow
                "fit-text": "#3D3D3D", // Warm Dark
                "fit-text-sub": "#8B8B9B",
                "fit-text-light": "#C4C4D0",
                "fit-border": "#F0EAE4",
              },
              fontFamily: {
                "sans": ["Nunito", "sans-serif"]
              },
              borderRadius: {
                "3xl": "1.5rem",
                "4xl": "2rem",
                "bubbly": "2.5rem",
              },
              boxShadow: {
                'soft': '0 10px 40px -10px rgba(255, 133, 119, 0.15)',
                'bubbly': '0 4px 0 0',
                'card': '0 8px 24px -6px rgba(0, 0, 0, 0.05)',
                'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.02)'
              }
            },
          },
        }
    </script>
<style>
        body {
            background-color: #FFF8F0;
            color: #3D3D3D;
            -webkit-tap-highlight-color: transparent;
            min-height: 100dvh;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    /* Responsive: keep everything within one viewport height */
    .fit-vh {
      min-height: 100dvh;
      height: 100dvh;
    }

    /* Tighten layout for short viewports (e.g., watch-sized mockups) */
    @media (max-height: 640px) {
      .compact-pad { padding-left: 1rem; padding-right: 1rem; }
      .compact-gap { gap: 0.875rem; }
      .compact-title { font-size: 1.75rem; line-height: 1.15; }
      .compact-image { height: 140px; }
    }

    @media (max-height: 480px) {
      .compact-title { font-size: 1.35rem; }
      .compact-image { display: none; }
      .compact-card { height: 96px !important; padding-top: 0.5rem; padding-bottom: 0.5rem; }
      .compact-num { font-size: 2.5rem !important; }
      .compact-current { font-size: 2.25rem !important; }
      .compact-footer { padding-top: 0.75rem; padding-bottom: 0.875rem; }
    }
  </style>
  </head>
 <body class="fit-vh antialiased flex flex-col bg-fit-cream text-fit-text font-sans overflow-hidden">
 <div class="px-6 compact-pad pt-5 pb-2 flex items-center justify-between z-10">
<button class="flex items-center justify-center w-10 h-10 rounded-full bg-white text-fit-text shadow-sm border border-fit-border hover:bg-fit-primary hover:text-white transition-all active:scale-95 group">
<span class="material-symbols-outlined text-xl group-hover:-translate-x-0.5 transition-transform">arrow_back</span>
</button>
</div>
 <div class="flex-1 min-h-0 flex flex-col px-6 compact-pad gap-6 compact-gap w-full max-w-md mx-auto">
<div class="flex flex-col mt-2">
<div class="flex items-center justify-between gap-3">
 <h1 class="text-3xl compact-title font-extrabold leading-tight text-fit-text">Barbell Bench Press</h1>
<span class="text-lg font-bold text-fit-text-sub">1 / 6</span>
</div>
<div class="mt-1">
<span class="text-xs font-semibold text-fit-text-light/50">Workout time · 18:32</span>
</div>
</div>
 <div class="flex flex-col gap-6 compact-gap min-h-0">
 <div class="relative w-full bg-white p-2 rounded-bubbly shadow-card group shrink-0 h-[clamp(140px,22vh,220px)] compact-image">
<div class="w-full h-full rounded-[2rem] overflow-hidden relative">
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCsDtt72x80n8kuCmwsg23gc2PBAT3TnGim__uZVMn4Bti0a7lEEOwCFRRH7yiNQgoYBEl6gM9eUIaJMDy56PF4RSvZYd0oC4TR-ExeXEoIKNjZ9vYD9TES0AMw0M2_N-N5Nr1LNzk5o-IkXUy3pj0tX-Sz-msoEHYahAS-lK1_IqdU_JmdL7lDuBUzAG8V6itQZWa7wQzTeJwGbFnej6kMHpyspWkQ21Ioo6JEvcVs6XreG6gm7WkGnIN58Q6r96mQr6ORIV7Jjas');"></div>
<div class="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-fit-primary/20 to-transparent pointer-events-none"></div>
</div>
</div>
<div class="flex flex-col items-center justify-center -mt-2">
<span class="text-[10px] font-bold text-fit-text-sub uppercase tracking-widest mb-1">Current Set</span>
<div class="flex items-baseline gap-2">
 <span class="compact-current text-[clamp(2.25rem,7vw,3.75rem)] font-black text-fit-primary tracking-tight">2 / 4</span>
</div>
</div>
</div>
 <div class="grid grid-cols-2 gap-4">
 <div class="compact-card bg-fit-primary/5 rounded-[2rem] py-3 px-2 flex flex-col items-center border border-fit-primary/10 h-[clamp(120px,24vh,192px)] justify-center relative overflow-hidden">
<div class="w-full text-center z-10">
<span class="text-[10px] font-bold text-fit-primary uppercase tracking-widest opacity-60">Weight</span>
</div>
 <div class="flex items-baseline gap-1 z-10 relative">
 <span class="compact-num text-[clamp(3rem,10vw,5.5rem)] font-black text-fit-text tracking-tighter leading-none">60</span>
 <span class="text-[11px] font-extrabold text-fit-text-sub/50 absolute -bottom-2 -right-8 tracking-widest">LB</span>
 </div>
 </div>
 <div class="compact-card bg-fit-primary/5 rounded-[2rem] py-3 px-2 flex flex-col items-center border border-fit-primary/10 h-[clamp(120px,24vh,192px)] justify-center relative overflow-hidden">
<div class="w-full text-center z-10">
<span class="text-[10px] font-bold text-fit-primary uppercase tracking-widest opacity-60">Reps</span>
</div>
 <div class="flex items-baseline gap-1 z-10">
 <span class="compact-num text-[clamp(3rem,10vw,5.5rem)] font-black text-fit-text tracking-tighter leading-none">10</span>
 <span class="text-[11px] font-extrabold text-fit-text-sub/50 tracking-widest">REPS</span>
 </div>
 </div>
 </div>
 </div>
 <div class="compact-footer mt-auto bg-white/95 backdrop-blur-md border-t border-fit-border px-6 compact-pad py-4 pb-6 z-50 shadow-soft shrink-0">
 <div class="max-w-md mx-auto flex items-center justify-between gap-4">
 <button class="w-full bg-fit-primary hover:bg-fit-primary-dark text-white rounded-xl h-[clamp(56px,10vh,64px)] flex items-center justify-center shadow-lg shadow-fit-primary/30 active:shadow-none active:scale-[0.98] transition-all">
 <span class="font-black text-[clamp(1.05rem,2.6vh,1.25rem)] tracking-normal uppercase">Complete Set</span>
 </button>
 </div>
 </div>

</body></html>
